services:
  mysql:
    image: mysql:8.4
    container_name: bookstore-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_here
      MYSQL_DATABASE: bookstore
      MYSQL_USER: book_user
      MYSQL_PASSWORD: strong_password_here
    ports:
      - "3307:3306"
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$MYSQL_ROOT_PASSWORD || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 40s
    volumes:
      - db_data:/var/lib/mysql
      # - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  be:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_PROXY_URL: ""
        APP_MODE: api
    container_name: bookstore-be
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_MODE: api
      PORT: 5000
      RUN_DB_PUSH: "1"
      SESSION_SECRET: ${SESSION_SECRET:-change_me_in_prod}
      REFRESH_SECRET: ${REFRESH_SECRET:-change_me_in_prod}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_ISSUER: ${JWT_ISSUER:-bookstore}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-bookstore-web}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://localhost:3000}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-8h}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-30d}
      DATABASE_URL: mysql://book_user:strong_password_here@mysql:3306/bookstore
      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      # NextAuth
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change_me_in_prod}
      # Resend Email
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:-onboarding@resend.dev}
      # MoMo Payment
      MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE:-MOMO}
      MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY:-F8BBA842ECF85}
      MOMO_SECRET_KEY: ${MOMO_SECRET_KEY:-K951B6PE1waDMi640xX08PD3vg6EkVlz}
      MOMO_ENDPOINT: ${MOMO_ENDPOINT:-https://test-payment.momo.vn/v2/gateway/api/create}
      MOMO_REDIRECT_URL: ${MOMO_REDIRECT_URL:-http://localhost:3000/payment/momo/callback}
      MOMO_IPN_URL: ${MOMO_IPN_URL:-http://localhost:5000/api/payment/momo/ipn}
    expose:
      - "5000"
    volumes:
      - ./logs:/app/logs

  fe:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_PROXY_URL: http://be:5000
        APP_MODE: web
    container_name: bookstore-fe
    restart: unless-stopped
    depends_on:
      - be
    environment:
      NODE_ENV: production
      APP_MODE: web
      PORT: 3000
      RUN_DB_PUSH: "0"
      API_PROXY_URL: http://be:5000
      SESSION_SECRET: ${SESSION_SECRET:-change_me_in_prod}
      JWT_ISSUER: ${JWT_ISSUER:-bookstore}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-bookstore-web}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-8h}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-30d}
      # NextAuth
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    expose:
      - "3000"

  caddy:
    image: caddy:2.8.4
    container_name: bookstore-proxy
    restart: unless-stopped
    depends_on:
      - fe
      - be
    ports:
      - "3000:3000"
      - "5000:5000"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  caddy_data:
  caddy_config:
